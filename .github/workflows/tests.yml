name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run in progress
# worthless: its verdict is about code that is no longer the tip. Cancelling
# it stops the MariaDB suite from running to the end for nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # About twice this job's normal run time, so a hung step ends here
    # instead of at GitHub's six-hour default.
    timeout-minutes: 20

    # `composer setup` runs `artisan migrate --force` against the credentials in
    # .env.example, which it has just copied to .env. Those name a server on
    # 127.0.0.1:3306, so without a database here the Setup Application step fails
    # and ci:check never runs. Values below mirror .env.example exactly — change
    # them together. The server is MariaDB 11.4, the engine production runs: the
    # migrations are written for it and read its information_schema, which MySQL
    # 8 lays out differently. phpunit.xml pins this job's feature and unit suite
    # to sqlite :memory:; the MariaDB suite is the separate job below.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: bestworkflows
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Production is cPanel ea-php84 and composer.json pins config.platform.php
      # to 8.4.17, so the suite has to run here on 8.4 — not on whatever the
      # development machines happen to have. Testing a PHP the host does not
      # have is how a $fillable trait collision that is fatal on 8.4 and fine on
      # 8.5 reached production once already; test-on-target-php.sh closes that
      # gap locally and this closes it in CI. Keep in step with composer.json
      # config.platform.php and TARGET_MINOR in test-on-target-php.sh.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  mariadb:
    runs-on: ubuntu-latest
    # A ceiling for a run that has gone wrong, not a target: a suite that
    # fails throughout takes well over an hour, and without this it would
    # run to GitHub's six-hour default.
    timeout-minutes: 90
    # A dedicated account cannot access another database, and the test bootstrap
    # rejects cached configuration and non-disposable targets before Laravel boots.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: ems_testing
          MARIADB_USER: ems_testing
          MARIADB_PASSWORD: disposable-ci-only
        ports:
          - 3306:3306
        # The data directory lives in memory. The Integration tests rebuild
        # the whole schema for every test, and on disk each of those DDL
        # statements waits for a flush; nothing in this database has to
        # outlive the job.
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    # APP_KEY decodes to exactly 32 bytes, the length AES-256-CBC requires. Any
    # other length fails every test that renders a page with "Unsupported
    # cipher or incorrect key length". It protects nothing: this database and
    # everything in it are thrown away with the job.
    env:
      APP_ENV: testing
      APP_KEY: base64:UlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlJSUlI=
      DB_PORT: '3306'
      DB_PASSWORD: disposable-ci-only
      EMS_MARIADB_TESTS: disposable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # With no environment file, most tests end with a "file_get_contents(.env):
      # Failed to open stream" warning. The file changes no value the suite
      # depends on: a variable this job or phpunit.mariadb.xml already set is
      # never overwritten by .env.
      - name: Create environment file
        run: cp .env.example .env

      - name: Run MariaDB suite
        run: php vendor/bin/pest --configuration=phpunit.mariadb.xml
